tags:
  - name: Shop/Category
    description: 사용자용 카테고리 조회 (전체 목록)

components:
  schemas:
    # -----------------------
    # Models
    # -----------------------
    # Prisma findMany() 결과는 평탄한(Flat) 구조입니다.
    # 프론트엔드에서 parentId를 이용해 계층을 표현합니다.
    Category:
      type: object
      properties:
        id:
          type: integer
          description: 카테고리 고유 ID
          example: 6
        name:
          type: string
          description: 카테고리명
          example: "신발"
        path:
          type: string
          description: URL 경로 (slug)
          example: "shoes"
        parentId:
          type: integer
          nullable: true
          description: 상위 카테고리 ID (null이면 최상위 1차 카테고리)
          example: 5
        createdAt:
          type: string
          format: date-time
          example: "2026-01-18T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-18T10:00:00.000Z"
    CategoryDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Category' # 기본 필드 상속
        - type: object
          properties:
            breadcrumbs:
              type: array
              description: "상위 카테고리부터 현재 카테고리까지의 경로"
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  path: { type: string }
              example:
                - { id: 5, name: "RUNNING", path: "running" }
                - { id: 6, name: "신발", path: "shoes" }

paths:
  /api/categories:
    get:
      summary: 전체 카테고리 목록 조회
      tags: [Shop/Category]
      description: |
        쇼핑몰의 GNB(메뉴) 및 사이드바 구성을 위한 **모든 카테고리**를 조회합니다.
        계층 구조가 아닌 **전체 리스트(Array)** 형태로 반환됩니다.
        (로그인 불필요, Client-Key 필요)
      security:
        - clientKey: []
      responses:
        200:
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        500:
          description: 서버 에러
  /api/categories/{id}:
    get:
      summary: 카테고리 상세 조회 (Breadcrumbs 포함)
      tags: [ Shop/Category ]
      description: "특정 카테고리 ID로 상세 정보를 조회하며, 상위 카테고리 경로(breadcrumbs)를 포함하여 반환합니다."
      security:
        - clientKey: [ ]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetailResponse'
        404:
          description: 카테고리 없음