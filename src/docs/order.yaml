tags:
  - name: Shop/Order
    description: 주문 및 결제 관리 (회원 전용)

components:
  schemas:
    # -----------------------
    # Enums (누락된 부분 추가)
    # -----------------------
    OrderStatus:
      type: string
      enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELED, RETURN_REQUESTED, RETURN_COMPLETED]
      description: "주문 상태 (PENDING: 결제 대기, PAID: 결제 완료)"

    # -----------------------
    # Request Bodies
    # -----------------------
    OrderItemInput:
      type: object
      properties:
        productSizeId:
          type: integer
          description: "옵션(ProductSize) ID"
          example: 12
        quantity:
          type: integer
          example: 2

    CreateOrderRequest:
      type: object
      required:
        - items
        - recipientName
        - recipientPhone
        - zipCode
        - address1
        - address2
        - paymentMethod
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
        recipientName:
          type: string
          example: "홍길동"
        recipientPhone:
          type: string
          example: "010-1234-5678"
        zipCode:
          type: string
          example: "12345"
        address1:
          type: string
          example: "서울시 강남구 테헤란로 123"
        address2:
          type: string
          example: "101호"
        gatePassword:
          type: string
          nullable: true
          example: "#1234"
        deliveryRequest:
          type: string
          nullable: true
          example: "문 앞에 놔주세요"
        paymentMethod:
          type: string
          description: "결제 수단 (카드, 가상계좌 등)"
          example: "카드"

    # -----------------------
    # Response Models
    # -----------------------
    OrderProductImage:
      type: object
      properties:
        url:
          type: string
          example: "https://example.com/image.jpg"

    OrderProductInfo:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: "프로스펙스 러닝화" }
        price: { type: integer, example: 129000 }
        style: { type: string }

    OrderProductColor:
      type: object
      properties:
        colorName: { type: string, example: "BLACK" }
        hexCode: { type: string }
        product:
          $ref: '#/components/schemas/OrderProductInfo'
        images:
          type: array
          items:
            $ref: '#/components/schemas/OrderProductImage'

    OrderProductSize:
      type: object
      properties:
        id: { type: integer }
        size: { type: string, example: "270" }
        productColor:
          $ref: '#/components/schemas/OrderProductColor'

    OrderItemDetail:
      type: object
      properties:
        id: { type: integer }
        quantity: { type: integer }
        price: { type: integer, description: "구매 당시 가격" }
        productSize:
          $ref: '#/components/schemas/OrderProductSize'

    # [수정] 배송 정보 필드 추가
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          description: 주문 고유 ID (PK)
        orderNumber:
          type: string
          description: "토스 결제용 주문 번호 (UUID)"
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: integer
        recipientName:
          type: string
        recipientPhone:
          type: string
        zipCode:
          type: string
        address1:
          type: string
        address2:
          type: string
        gatePassword:
          type: string
          nullable: true
        deliveryRequest:
          type: string
          nullable: true
        payment:
          type: object
          nullable: true
          properties:
            status: { type: string, example: "READY" }
            method: { type: string, example: "카드" }
            amount: { type: integer }
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDetail'

paths:
  /api/orders:
    post:
      summary: 주문 생성 (결제 요청)
      tags: [Shop/Order]
      description: |
        주문 정보를 받아 임시 주문을 생성하고, 토스페이먼츠 위젯을 띄우기 위한 `orderNumber`(UUID)를 반환합니다.
        (재고 차감 처리됨)
      security:
        - clientKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        201:
          description: 주문 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        400:
          description: 잘못된 요청 (재고 부족 등)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "OUT_OF_STOCK: 소닉 5 (270)"
        401:
          description: 인증 실패

    get:
      summary: 내 주문 목록 조회
      tags: [Shop/Order]
      security:
        - clientKey: []
        - bearerAuth: []
      responses:
        200:
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

  /api/orders/{id}:
    get:
      summary: 주문 상세 조회
      tags: [Shop/Order]
      security:
        - clientKey: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        403:
          description: 권한 없음 (본인의 주문이 아님)
        404:
          description: 주문 정보를 찾을 수 없음

  /api/orders/confirm:
    post:
      summary: 결제 승인 (주문 완료 처리)
      tags: [ Shop/Order ]
      description: |
        토스페이먼츠 인증 성공 후, 최종 결제 승인을 요청합니다.
        성공 시 주문 상태가 PAID로 변경됩니다.
      security:
        - clientKey: [ ]
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentKey
                - orderId
                - amount
              properties:
                paymentKey:
                  type: string
                  description: "토스에서 발급받은 결제 키"
                  example: "tgen_202405..."
                orderId:
                  type: string
                  description: "주문 번호 (UUID)"
                  example: "a4e3-2212-..."
                amount:
                  type: integer
                  description: "결제 금액"
                  example: 53000
      responses:
        200:
          description: 결제 및 주문 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        400:
          description: 금액 불일치 또는 승인 실패